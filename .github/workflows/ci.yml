# RELEASE-DECISION-PACK-01 (HPM 2026-10-26) — LOCAL PROPOSAL: runs only once pushed, with Louis's GO.
# Two required status checks for `main` (see docs/review/sport-plan-03/release-gates/github-ruleset-main.json), accepted
# only from GitHub Actions (integration_id 15368 in the ruleset: a status posted by anything else does not count):
#   verify:sport-approvals — every DH sports sign-off (U, C, D, S, common) cites a signed, authorised approval of the
#                            exact content served; no private key in the repository; released content pins intact.
#   tests                  — the unit suites of every package (integration suites skip without a local stack; the
#                            longitudinal-engine ones do not skip, so they are excluded there).
# No secret is used or needed. Action versions are major tags: pin them to commit SHAs when the ruleset is enabled.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sport-approvals:
    name: verify:sport-approvals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: planning-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - name: Approvals of the sign-off tables (registry, signatures, authorisations, content, catalogue, gate)
        run: npm run verify:sport-approvals
      - name: Approval chain, gate and released-version pins (unit)
        run: npx vitest run tests/unit/v2DhReleaseGates01.test.ts tests/unit/v2DhSportGate01.test.ts tests/unit/v2DhSportGate01b.test.ts tests/unit/v2DhSportGate01c.test.ts

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install (each package has its own lockfile)
        run: for p in planning-engine prescription-engine longitudinal-engine head-coach-engine web; do npm ci --prefix "$p"; done
      - name: Build the engines head-coach-engine depends on (build:release order)
        run: |
          npm --prefix planning-engine run build
          npm --prefix prescription-engine run build
      - run: npm --prefix planning-engine test
      - run: npm --prefix prescription-engine test
      # Its integration files are not gated on a stack (no skip): without a database their hooks fail. Unit tests only.
      - name: npm --prefix longitudinal-engine test (unit; integration files need a local stack)
        run: npm --prefix longitudinal-engine test -- --exclude "**/*.integration.test.ts"
      - run: npm --prefix head-coach-engine test
      - name: Edge suites (bundles, session-execution guard, error mapping; fails on a TEST sign-off bundle)
        run: npm --prefix head-coach-engine run test:edge
      - run: npm --prefix web test
